            progress_delta: -1
            state_delta: regressed
            branch_label: dead_end
            dead_end: true
      gate_2:
        phase: gate
        mode: gate_2
        progress: 1
        abstract_fields: {family: multi_gate, gate: 2}
        oracle_action: unlock_gate
        edges:
