            progress_delta: 0
            state_delta: neutral
            branch_label: stall
          retreat:
            next_node: start
            observation: You retreat to the first gate.
            progress_delta: -1
            state_delta: regressed
            branch_label: regression
      gate_3:
        phase: gate
        mode: gate_3
        progress: 2
        abstract_fields: {family: multi_gate, gate: 3}
        oracle_action: unlock_gate
        edges:
          unlock_gate:
            next_node: success
            observation: The final gate opens. Task complete.
            terminal: true
            success: true
            progress_delta: 2
            state_delta: improved
            branch_label: success
            verifier_signals: {gate_progress: 1}
          rattle_gate:
            next_node: gate_3
            observation: Rattling the third gate wastes time.
            progress_delta: 0
            state_delta: neutral
            branch_label: stall
          retreat:
            next_node: gate_2
            observation: You retreat to the second gate.
            progress_delta: -1
            state_delta: regressed
            branch_label: regression
      blocked:
        phase: trap
        mode: blocked
        progress: -1
        abstract_fields: {family: multi_gate, gate: 0}
        oracle_action: reset_gate
        edges:
          reset_gate:
            next_node: start
            observation: You reset the jammed gate.
            progress_delta: 1
            state_delta: improved
            branch_label: recovery
            recovery: true
            verifier_signals: {repair_quality: 1}
          give_up:
            next_node: failure
            observation: You give up.
            terminal: true
            progress_delta: -1
            state_delta: regressed
            branch_label: failure
            dead_end: true
      success: {phase: done, mode: success, progress: 4, abstract_fields: {family: multi_gate}, edges: {}}
      failure: {phase: done, mode: failure, progress: -2, abstract_fields: {family: multi_gate}, edges: {}}
