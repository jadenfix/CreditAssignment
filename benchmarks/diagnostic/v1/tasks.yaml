          double_down: {next_node: failure, observation: Double down fails., terminal: true, progress_delta: -1, state_delta: regressed, branch_label: failure, dead_end: true}
      success: {phase: done, mode: success, progress: 3, abstract_fields: {family: dead_end}, edges: {}}
