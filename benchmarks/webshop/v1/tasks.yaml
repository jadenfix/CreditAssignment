        abstract_fields: {page: product, target_kind: mug}
        oracle_action: add_to_cart
        edges:
          add_to_cart: {next_node: cart, observation: Added the travel mug to cart., progress_delta: 1, state_delta: improved, branch_label: cart}
      wrong_product:
        phase: decide
        mode: wrong_product
        progress: 0
        abstract_fields: {page: product, target_kind: wrong}
        oracle_action: back
        edges:
          back: {next_node: results, observation: Returned to results to recover., progress_delta: 0, state_delta: neutral, branch_label: recovery, recovery: true}
      cart:
        phase: purchase
        mode: cart
        progress: 3
        abstract_fields: {page: cart, target_kind: mug}
        oracle_action: checkout
        edges:
          checkout: {next_node: success, observation: Checkout succeeds., terminal: true, success: true, progress_delta: 1, state_delta: improved, branch_label: success}
      success: {phase: done, mode: success, progress: 4, abstract_fields: {page: done, target_kind: mug}, edges: {}}
      failure: {phase: done, mode: failure, progress: -1, abstract_fields: {page: done, target_kind: wrong}, edges: {}}
  - task_id: webshop_smoke_red_mug
    split: smoke
    instruction: Buy the red ceramic mug.
    metadata: {domain: shopping, target_product: red_mug}
