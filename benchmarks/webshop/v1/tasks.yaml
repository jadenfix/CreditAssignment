benchmark_name: webshop
revision: v1
state_abstraction_version: v1
verifier_version: v1
tasks:
  - task_id: webshop_train_red_mug
    split: train
    instruction: Find the red ceramic mug under $15 and complete checkout.
    metadata: {domain: shopping, target_product: red_mug, constraints: {color: red, material: ceramic, max_price: 15}}
    initial_state: search
    states:
      search:
        phase: browse
        mode: search
        progress: 0
        abstract_fields: {page: search, phase: browse}
        oracle_action: search_target
        edges:
          search_target: {next_node: results, observation: Results show red mugs and nearby alternatives., progress_delta: 1, state_delta: improved, branch_label: search_hit, verifier_signals: {query_quality: 1}}
          search_other: {next_node: noisy_results, observation: Results skew toward bottles., progress_delta: 0, state_delta: neutral, branch_label: search_noise}
          browse_featured: {next_node: search, observation: Featured items are irrelevant., progress_delta: 0, state_delta: neutral, branch_label: stall}
      noisy_results:
        phase: browse
        mode: noisy_results
        progress: 0
        abstract_fields: {page: results, phase: browse, quality: noisy}
        oracle_action: open_target
        edges:
          open_distractor: {next_node: wrong_product, observation: Opened a red bottle that mismatches the material., progress_delta: -1, state_delta: regressed, branch_label: dead_end, dead_end: true}
          open_target: {next_node: product, observation: Opened the red ceramic mug., progress_delta: 1, state_delta: improved, branch_label: product_match, verifier_signals: {selection_quality: 1}}
          refine_search: {next_node: noisy_results, observation: Refining does not improve noisy results., progress_delta: 0, state_delta: neutral, branch_label: stall}
      results:
        phase: browse
        mode: results
        progress: 1
        abstract_fields: {page: results, phase: browse, quality: clean}
        oracle_action: open_target
        edges:
          open_target: {next_node: product, observation: Opened the red ceramic mug., progress_delta: 1, state_delta: improved, branch_label: product_match, verifier_signals: {selection_quality: 1}}
          open_distractor: {next_node: wrong_product, observation: Opened the wrong product type., progress_delta: -1, state_delta: regressed, branch_label: dead_end, dead_end: true}
          refine_search: {next_node: results, observation: Search is already good., progress_delta: 0, state_delta: neutral, branch_label: stall}
      product:
        phase: decide
        mode: product
        progress: 2
        abstract_fields: {page: product, phase: decide}
        oracle_action: add_to_cart
        edges:
          add_to_cart: {next_node: cart, observation: Added the correct item to cart., progress_delta: 1, state_delta: improved, branch_label: cart, verifier_signals: {cart_quality: 1}}
          back: {next_node: results, observation: Returned to results without buying., progress_delta: 0, state_delta: neutral, branch_label: stall}
          compare_prices: {next_node: product, observation: Price comparison finds nothing cheaper., progress_delta: 0, state_delta: neutral, branch_label: stall}
      wrong_product:
        phase: decide
        mode: wrong_product
        progress: 0
        abstract_fields: {page: product, phase: wrong}
        oracle_action: back
        edges:
          back: {next_node: results, observation: Went back to the results page., progress_delta: 0, state_delta: neutral, branch_label: recovery, recovery: true, verifier_signals: {recovery_quality: 1}}
          add_to_cart: {next_node: failure, observation: Buying the wrong product fails the task., terminal: true, progress_delta: -1, state_delta: regressed, branch_label: failure, dead_end: true}
      cart:
        phase: purchase
        mode: cart
        progress: 3
        abstract_fields: {page: cart, phase: purchase}
        oracle_action: checkout
        edges:
          checkout: {next_node: success, observation: Checkout succeeds with the correct item., terminal: true, success: true, progress_delta: 1, state_delta: improved, branch_label: success, verifier_signals: {purchase_quality: 1}}
          continue_shopping: {next_node: search, observation: Went back to search for no reason., progress_delta: -2, state_delta: regressed, branch_label: regression}
      success: {phase: done, mode: success, progress: 4, abstract_fields: {page: done, phase: done}, edges: {}}
      failure: {phase: done, mode: failure, progress: -1, abstract_fields: {page: done, phase: failed}, edges: {}}
