    states:
      search:
        phase: browse
        mode: search
        progress: 0
        abstract_fields: {page: search, target_kind: mug}
        oracle_action: search:red mug
        edges:
          "search:red mug": {next_node: results, observation: Results show the mug., progress_delta: 1, state_delta: improved, branch_label: search_hit}
      results:
        phase: browse
        mode: results
        progress: 1
        abstract_fields: {page: results, target_kind: mug}
        oracle_action: open:red_mug
        edges:
          "open:red_mug": {next_node: product, observation: Opened the correct mug., progress_delta: 1, state_delta: improved, branch_label: product_match}
      product:
