benchmark_name: alfworld
revision: v1
state_abstraction_version: v1
verifier_version: v1
tasks:
  - task_id: alfworld_train_pick_place
    split: train
    instruction: Go to the kitchen, pick up the apple, and place it in the bowl.
    metadata: {domain: embodied_text, task_type: pick_place, target_object: apple, target_container: bowl}
    states:
      start:
        phase: navigate
        mode: hallway
        progress: 0
        abstract_fields: {phase_tag: navigate, has_target: false}
        oracle_action: navigate_target
        edges:
          navigate_target: {next_node: kitchen, observation: You enter the kitchen., progress_delta: 1, state_delta: improved, branch_label: navigation, verifier_signals: {navigation_quality: 1}}
          navigate_other: {next_node: wrong_room, observation: The bedroom is a dead end for this task., progress_delta: -1, state_delta: regressed, branch_label: dead_end, dead_end: true}
          look_around: {next_node: start, observation: You look around the hallway but find nothing useful., progress_delta: 0, state_delta: neutral, branch_label: stall}
      wrong_room:
        phase: navigate
        mode: wrong_room
        progress: -1
        abstract_fields: {phase_tag: navigate, has_target: false}
        oracle_action: navigate_target
        edges:
          navigate_target: {next_node: kitchen, observation: You recover and reach the kitchen., progress_delta: 1, state_delta: improved, branch_label: recovery, recovery: true, verifier_signals: {recovery_quality: 1}}
          wait: {next_node: wrong_room, observation: Waiting in the wrong room changes nothing., progress_delta: 0, state_delta: neutral, branch_label: stall}
      kitchen:
        phase: acquire
        mode: at_target_room
        progress: 1
        abstract_fields: {phase_tag: acquire, has_target: false}
        oracle_action: pick_target
        edges:
          pick_target: {next_node: carrying, observation: You pick up the apple., progress_delta: 1, state_delta: improved, branch_label: acquire, verifier_signals: {acquire_quality: 1}}
          pick_distractor: {next_node: failure, observation: Taking the wrong object ends the attempt., terminal: true, progress_delta: -1, state_delta: regressed, branch_label: failure, dead_end: true}
          look_around: {next_node: kitchen, observation: You look around the kitchen but nothing changes., progress_delta: 0, state_delta: neutral, branch_label: stall}
      carrying:
        phase: place
        mode: has_target
        progress: 2
        abstract_fields: {phase_tag: place, has_target: true}
        oracle_action: place_target
        edges:
          place_target: {next_node: success, observation: You place the apple in the bowl., terminal: true, success: true, progress_delta: 2, state_delta: improved, branch_label: success, verifier_signals: {placement_quality: 1}}
          misuse_target: {next_node: failure, observation: Misusing the object fails the task., terminal: true, progress_delta: -2, state_delta: regressed, branch_label: failure, dead_end: true}
          look_around: {next_node: carrying, observation: You look around but still need to place the object., progress_delta: 0, state_delta: neutral, branch_label: stall}
      success: {phase: done, mode: success, progress: 4, abstract_fields: {phase_tag: done, has_target: false}, edges: {}}
      failure: {phase: done, mode: failure, progress: -2, abstract_fields: {phase_tag: done, has_target: false}, edges: {}}
