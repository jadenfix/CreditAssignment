name: diagnostic_paper_gcp
research_objective: evaluate branch-aware plus hindsight credit assignment on the diagnostic benchmark under matched budgets.
env:
  name: diagnostic_branch_lab
  split: train
  config: {}
policy:
  name: prompted
  config:
    exploration_rate: 0.25
    seed: 7
trainer:
  name: outcome_only
  config: {}
tracking:
  backend: local
  config: {}
store:
  sqlite_path: runs/creditlab.sqlite
  artifact_root: artifacts
benchmark:
  name: diagnostic
  revision: v1
  manifest_path: benchmarks/diagnostic/v1/tasks.yaml
  collect_split: train
  eval_split: eval
model_backend:
  name: local_heuristic
  config: {}
training_backend:
  name: local_table
  config: {}
deployment:
  profile: gcp_gpu_dev
  platform: gcp_gpu
  container_image: creditlab-gpu:latest
  workspace_dir: /workspace/creditlab
  data_dir: /data/creditlab
  gcp_instance_profile: g2-standard-8
  gcs_sync_uri: gs://creditlab-491502-runs/runs
paper_export:
  output_dir: artifacts/paper
  manuscript_path: paper/manuscript.md
sweep:
  enabled: true
  seeds: [7, 11, 19]
  safety:
    allow_gcp_execution: false
    require_healthy_gpu_for_gcp: true
    max_total_runs: 24
    max_failed_runs: 2
    max_retry_attempts: 2
    retry_backoff_seconds: 2.0
    max_total_prompt_tokens: 80000
    max_total_completion_tokens: 40000
    max_total_verifier_calls: 5000
    max_total_wall_clock_seconds: 1800
    max_estimated_cost_usd: 2.0
    estimated_prompt_cost_per_1k: 0.0
    estimated_completion_cost_per_1k: 0.0
    estimated_instance_cost_per_hour: 0.70
experiment:
  seeds: [7, 11, 19]
  budgets:
    rollout_count: 6
    max_turns: 4
    max_prompt_tokens: 128
    max_completion_tokens: 64
    max_verifier_calls: 32
    wall_clock_seconds: 60
