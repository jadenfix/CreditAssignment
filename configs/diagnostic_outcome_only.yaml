name: diagnostic_outcome_only
research_objective: train the outcome-only baseline on diagnostic trajectories before branch-aware or hindsight online training.
env:
  name: diagnostic_branch_lab
  split: train
  config: {}
policy:
  name: prompted
  config:
    exploration_rate: 0.2
    seed: 7
trainer:
  name: outcome_only
  config: {}
tracking:
  backend: local
  config: {}
store:
  sqlite_path: runs/creditlab.sqlite
  artifact_root: artifacts
benchmark:
  name: diagnostic
  revision: v1
  manifest_path: benchmarks/diagnostic/v1/tasks.yaml
  collect_split: train
  eval_split: eval
deployment:
  profile: local_smoke
  platform: local
sweep:
  safety:
    allow_aws_execution: false
    max_total_runs: 8
    max_failed_runs: 1
    max_retry_attempts: 1
    retry_backoff_seconds: 0.0
    max_total_prompt_tokens: 15000
    max_total_completion_tokens: 8000
    max_total_verifier_calls: 1000
    max_total_wall_clock_seconds: 300
    max_estimated_cost_usd: 1.0
experiment:
  seeds: [7]
  budgets:
    rollout_count: 6
    max_turns: 4
    max_prompt_tokens: 128
    max_completion_tokens: 64
    max_verifier_calls: 32
    wall_clock_seconds: 30
