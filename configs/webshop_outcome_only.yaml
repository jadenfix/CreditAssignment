name: webshop_outcome_only
research_objective: prepare the first outcome-only baseline on WebShop smoke trajectories after the logging and replay path is stable.
env:
  name: webshop
  split: smoke
  config: {}
policy:
  name: prompted
  config:
    exploration_rate: 0.2
    seed: 13
trainer:
  name: outcome_only
  config: {}
tracking:
  backend: local
  config: {}
store:
  sqlite_path: runs/creditlab.sqlite
  artifact_root: artifacts
experiment:
  seeds: [13]
  budgets:
    rollout_count: 4
    max_turns: 5
    max_prompt_tokens: 128
    max_completion_tokens: 64
    max_verifier_calls: 20
    wall_clock_seconds: 30

