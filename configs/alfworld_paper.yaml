name: alfworld_paper
research_objective: evaluate branch-aware plus hindsight credit assignment on ALFWorld under matched budgets.
env:
  name: alfworld
  split: train
  config: {}
policy:
  name: prompted
  config:
    exploration_rate: 0.2
    seed: 29
trainer:
  name: outcome_only
  config: {}
tracking:
  backend: local
  config: {}
store:
  sqlite_path: runs/creditlab.sqlite
  artifact_root: artifacts
benchmark:
  name: alfworld
  revision: v1
  manifest_path: benchmarks/alfworld/v1/tasks.yaml
  collect_split: train
  eval_split: eval
deployment:
  profile: aws_gpu_dev
  platform: aws_gpu
  container_image: creditlab-gpu:latest
  workspace_dir: /workspace/creditlab
  data_dir: /data/creditlab
  aws_instance_profile: g6e.4xlarge
paper_export:
  output_dir: artifacts/paper
  manuscript_path: paper/manuscript.md
sweep:
  enabled: true
  seeds: [29, 31, 37]
  safety:
    allow_aws_execution: false
    require_healthy_gpu_for_aws: true
    max_total_runs: 24
    max_failed_runs: 2
    max_retry_attempts: 2
    retry_backoff_seconds: 2.0
    max_total_prompt_tokens: 150000
    max_total_completion_tokens: 90000
    max_total_verifier_calls: 5000
    max_total_wall_clock_seconds: 1800
    max_estimated_cost_usd: 12.0
    estimated_prompt_cost_per_1k: 0.0
    estimated_completion_cost_per_1k: 0.0
    estimated_instance_cost_per_hour: 4.0
experiment:
  seeds: [29, 31, 37]
  budgets:
    rollout_count: 6
    max_turns: 6
    max_prompt_tokens: 160
    max_completion_tokens: 96
    max_verifier_calls: 32
    wall_clock_seconds: 60
