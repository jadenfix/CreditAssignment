name: webshop_paper
research_objective: evaluate branch-aware plus hindsight credit assignment on WebShop under matched budgets.
env:
  name: webshop
  split: train
  config: {}
policy:
  name: prompted
  config:
    exploration_rate: 0.2
    seed: 13
trainer:
  name: outcome_only
  config: {}
tracking:
  backend: local
  config: {}
store:
  sqlite_path: runs/creditlab.sqlite
  artifact_root: artifacts
benchmark:
  name: webshop
  revision: v1
  manifest_path: benchmarks/webshop/v1/tasks.yaml
  collect_split: train
  eval_split: eval
deployment:
  profile: aws_gpu_dev
  platform: aws_gpu
  container_image: creditlab-gpu:latest
  workspace_dir: /workspace/creditlab
  data_dir: /data/creditlab
  aws_instance_profile: g6e.4xlarge
paper_export:
  output_dir: artifacts/paper
  manuscript_path: paper/manuscript.md
sweep:
  enabled: true
  seeds: [13, 17, 23]
experiment:
  seeds: [13, 17, 23]
  budgets:
    rollout_count: 6
    max_turns: 6
    max_prompt_tokens: 160
    max_completion_tokens: 96
    max_verifier_calls: 32
    wall_clock_seconds: 60

