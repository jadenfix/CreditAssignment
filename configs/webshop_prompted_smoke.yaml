name: webshop_prompted_smoke
research_objective: validate the WebShop benchmark adapter, verifier events, and replay/report path.
env:
  name: webshop
  split: smoke
  config: {}
policy:
  name: prompted
  config:
    exploration_rate: 0.1
    seed: 13
trainer:
  name: outcome_only
  config: {}
tracking:
  backend: local
  config: {}
store:
  sqlite_path: runs/creditlab.sqlite
  artifact_root: artifacts
benchmark:
  name: webshop
  revision: v1
  manifest_path: benchmarks/webshop/v1/tasks.yaml
  collect_split: smoke
  eval_split: smoke
deployment:
  profile: local_smoke
  platform: local
experiment:
  seeds: [13]
  budgets:
    rollout_count: 4
    max_turns: 5
    max_prompt_tokens: 128
    max_completion_tokens: 64
    max_verifier_calls: 20
    wall_clock_seconds: 30

